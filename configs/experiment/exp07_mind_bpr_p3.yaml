experiment_name: exp07_mind_bpr_p3
seed: 42
dataset:
  name: mind_large
  processed_root: data/processed/mind_large
  dev_impressions: data/processed/mind_large/dev/impressions
  items_mapping: data/processed/mind_large/mappings/items
model:
  name: bpr
reranking:
  enabled: true
  method: "popularity_diversity"
  base_checkpoint: "artifacts/checkpoints/exp04_mind_bpr_bpr.pkl"
  popularity_train_path: "data/processed/mind_large/train/positive_interactions"
  top_k: 20
  candidate_pool_size: null

  weights:
    relevance: 0.75
    diversity: 0.05
    long_tail: 0.20
evaluation:
  top_k_list:
  - 5
  - 10
  - 20
  eval_batch_size: 10000
  metrics:
  - ndcg
  - recall
  - hit_rate
  - mrr
  - coverage
  - gini
  - category_diversity
  - long_tail_exposure
  slices:
  - overall
  - cold_item
  - warm_item
  - cold_user
  - warm_user
  - head_item
  - long_tail_item
  - zero_click_item
  - catalog_cold_item
  - catalog_warm_item
  item_slicing:
    head_fraction: 0.2
  bootstrap:
    enabled: true
    num_resamples: 1000
    confidence_level: 0.95
    unit: user
    seed: 42
    batch_size: 32
