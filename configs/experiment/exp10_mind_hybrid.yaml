experiment_name: "exp10_mind_hybrid"
seed: 42

dataset:
  name: "mind_large"
  train_interactions: "data/processed/mind_large/train/positive_interactions"
  dev_impressions: "data/processed/mind_large/dev/impressions"
  items_mapping: "data/processed/mind_large/mappings/items"

model:
  name: "hybrid"
  mode: "adaptive"
  embedding_dim: 64
  normalize_branch_scores: true
  cf_checkpoint: "artifacts/checkpoints/exp04_mind_bpr_bpr.pkl"
  seq_checkpoint: "artifacts/checkpoints/exp05_mind_sasrec_sasrec.pkl"
  content_checkpoint: "artifacts/checkpoints/exp05_mind_content_content_based.pkl"
  static_weights: [0.4, 0.4, 0.2]
  cf_params:
    epochs: 2
    batch_size: 4096
  seq_params:
    max_seq_len: 50
    num_blocks: 2
    num_heads: 2
    epochs: 2
    batch_size: 512

evaluation:
  top_k_list: [5, 10, 20]
  eval_batch_size: 10000
  metrics: ["ndcg", "recall", "hit_rate", "mrr", "coverage", "gini"]
  slices: ["overall", "cold_item", "warm_item", "cold_user", "warm_user"]
