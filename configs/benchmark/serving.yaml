base_url: http://127.0.0.1:8000
concurrency: [1, 5, 10, 20]
duration_seconds: 30
warmup_requests: 20
request_timeout_seconds: 5
# Real dev users and click histories (make benchmark-payloads). Without it every request is
# an anonymous user, which skips the ranker and understates latency.
payloads_file: data/processed/mind_large/benchmark/serving_payloads.jsonl
server_pid: null
output: reports/benchmarks/serving.json
